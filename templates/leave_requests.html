<!DOCTYPE html>
<html>
<head>
    <title>Leave Requests</title>
</head>
<body>

<h1>Leave Requests</h1>

{% if leave_requests %}

<table border="1">

<tr>
    <th>Employee</th>
    <th>Leave Type</th>
    <th>Start Date</th>
    <th>End Date</th>
    <th>Status</th>
</tr>

{% for leave in leave_requests %}

<tr>
    <td>{{ leave.employee.name }}</td>
    <td>{{ leave.leave_type }}</td>
    <td>{{ leave.start_date }}</td>
    <td>{{ leave.end_date }}</td>
    <td>{{ leave.status }}</td>
</tr>

{% endfor %}

</table>

{% else %}

<p>No leave requests found.</p>

{% endif %}

</body>
</html>
